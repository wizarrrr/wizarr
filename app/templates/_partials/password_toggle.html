{# Button that shows or hides the password in the field with the ID input_id.
   Put the field and the button in a "relative" container, and give the field
   the "pr-10" class. js/password-toggle.js adds the behavior. #}
{% macro password_toggle(input_id) -%}
  <button type="button"
          data-password-toggle
          aria-controls="{{ input_id }}"
          aria-pressed="false"
          aria-label="{{ _('Show password') }}"
          class="absolute inset-y-0 right-0 flex items-center px-3 rounded-r-lg text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
    <svg data-icon="show"
         class="w-4 h-4"
         aria-hidden="true"
         fill="none"
         stroke="currentColor"
         viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
      </path>
    </svg>
    <svg data-icon="hide"
         class="hidden w-4 h-4"
         aria-hidden="true"
         fill="none"
         stroke="currentColor"
         viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21">
      </path>
    </svg>
  </button>
{%- endmacro %}

<!-- Shown when a delete did not go through on the media server -->
<div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all w-full max-w-md dark:bg-gray-800"
     role="dialog"
     aria-modal="true"
     aria-labelledby="modal-title">
  <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
    <h3 class="text-lg font-semibold text-gray-900 dark:text-white">{{ _("Not everything was removed") }}</h3>
    <button type="button"
            onclick="closeModal()"
            class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
      <svg class="w-3 h-3"
           aria-hidden="true"
           xmlns="http://www.w3.org/2000/svg"
           fill="none"
           viewBox="0 0 14 14">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
      </svg>
      <span class="sr-only">{{ _("Close") }}</span>
    </button>
  </div>
  <div class="px-4 pb-4 pt-5 sm:p-6 space-y-3">
    {% for username, server in failed %}
      <p class="text-sm text-gray-700 dark:text-gray-300" data-delete-problem>
        {{ _("%(who)s on %(where)s could not be removed. The server did not confirm it, so the account is still listed here. Try again in a minute.", who=username, where=server) }}
      </p>
    {% endfor %}
    <div class="flex justify-end pt-2">
      <button type="button"
              onclick="closeModal()"
              class="inline-flex justify-center rounded-md bg-primary px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-primary_hover">
        {{ _("Close") }}
      </button>
    </div>
  </div>
</div>

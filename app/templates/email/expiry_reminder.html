<!DOCTYPE html>
<html>
  <body style="margin:0;
               padding:0;
               background-color:#f3f4f6;
               font-family:Arial,Helvetica,sans-serif">
    <table role="presentation"
           width="100%"
           cellpadding="0"
           cellspacing="0"
           style="padding:24px 0">
      <tr>
        <td align="center">
          <table role="presentation"
                 width="480"
                 cellpadding="0"
                 cellspacing="0"
                 style="background-color:#ffffff;
                        border-radius:8px;
                        padding:32px">
            <tr>
              <td style="font-size:20px;
                         font-weight:bold;
                         color:#111827;
                         padding-bottom:16px">Your access is expiring soon</td>
            </tr>
            <tr>
              <td style="font-size:14px;
                         color:#374151;
                         line-height:1.5;
                         padding-bottom:8px">Hi {{ user.username }},</td>
            </tr>
            <tr>
              <td style="font-size:14px;
                         color:#374151;
                         line-height:1.5;
                         padding-bottom:24px">
                {% if days_left == 1 %}
                  Your access expires in 1 day.
                {% else %}
                  Your access expires in {{ days_left }} days.
                {% endif %}
                Please contact your administrator if you'd like to keep your access active.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

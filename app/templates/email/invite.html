<!DOCTYPE html>
<html>
  <body style="margin:0;
               padding:0;
               background-color:#f3f4f6;
               font-family:Arial,Helvetica,sans-serif">
    <table role="presentation"
           width="100%"
           cellpadding="0"
           cellspacing="0"
           style="padding:24px 0">
      <tr>
        <td align="center">
          <table role="presentation"
                 width="480"
                 cellpadding="0"
                 cellspacing="0"
                 style="background-color:#ffffff;
                        border-radius:8px;
                        padding:32px">
            <tr>
              <td style="font-size:20px;
                         font-weight:bold;
                         color:#111827;
                         padding-bottom:16px">You've been invited</td>
            </tr>
            <tr>
              <td style="font-size:14px;
                         color:#374151;
                         line-height:1.5;
                         padding-bottom:24px">
                Someone has invited you to set up access. Click the button below to get started.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <a href="{{ link }}"
                   style="background-color:#4f46e5;
                          color:#ffffff;
                          text-decoration:none;
                          padding:12px 24px;
                          border-radius:6px;
                          font-size:14px;
                          font-weight:bold;
                          display:inline-block">Accept Invitation</a>
              </td>
            </tr>
            <tr>
              <td style="font-size:12px;color:#6b7280;line-height:1.5;">
                If the button doesn't work, copy and paste this link into your browser:
                <br>
                <a href="{{ link }}" style="color:#4f46e5;word-break:break-all;">{{ link }}</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

name: Run Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    if: github.actor != 'weblate'
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
        
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: pyproject.toml
        
    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-
    
    - name: Install dependencies
      run: |
        uv sync --dev
        
    # The e2e tests need the built CSS and vendor JS (htmx, Alpine).
    # The Docker image builds them with the Node version of Alpine 3.23.
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: app/static/package-lock.json

    - name: Build static assets
      run: |
        npm --prefix app/static ci
        npm --prefix app/static run build

    - name: Install Playwright browsers
      run: |
        uv run playwright install --with-deps
        
    - name: Run tests
      run: |
        uv run pytest --verbose
        
